name: OneMessages Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OneMessages-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify AndroidX dependency alignment
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon > /tmp/dependencies.txt
          if grep -q "io.github.oneuiproject.sesl" /tmp/dependencies.txt; then
            echo "SESL forked AndroidX artifacts must not be on the Compose app classpath." >&2
            exit 1
          fi
          grep -q "androidx.core:core-ktx:1.13.1" /tmp/dependencies.txt

